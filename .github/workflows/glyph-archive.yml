name: Glyph archive integrity experiment

on:
  pull_request:
    paths:
      - "experiments/glyph_archive.py"
      - "tests/test_glyph_archive.py"
      - ".github/workflows/glyph-archive.yml"
  push:
    paths:
      - "experiments/glyph_archive.py"
      - "tests/test_glyph_archive.py"
      - ".github/workflows/glyph-archive.yml"

permissions:
  contents: read

jobs:
  stdlib-unicode:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Compile, test, and verify glyph archive contract
        run: |
          python -m py_compile experiments/glyph_archive.py
          python -m unittest discover -s tests -p 'test_glyph_archive.py' -v
