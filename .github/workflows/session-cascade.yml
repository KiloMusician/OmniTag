name: Session cascade experiment

on:
  pull_request:
    paths:
      - "experiments/session-cascade/**"
      - ".github/workflows/session-cascade.yml"
  push:
    paths:
      - "experiments/session-cascade/**"
      - ".github/workflows/session-cascade.yml"

permissions:
  contents: read

jobs:
  stdlib-unit:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Compile and test isolated experiment
        run: |
          python -m py_compile experiments/session-cascade/omnitag.py experiments/session-cascade/evidence.py
          cd experiments/session-cascade && python -m unittest discover -s tests -v
